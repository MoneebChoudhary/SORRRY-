<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgive Me?</title>
    <style>
        /* General Setup and Background */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #ffd3e0, #f8bdf0); /* Pinkish gradient like the video */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden; /* Prevents scrollbars when buttons fly around */
        }

        /* The Main White Card */
        .card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 320px;
            position: relative;
            z-index: 10;
        }

        /* Images / GIFs */
        .gif-container img {
            width: 150px;
            height: 150px;
            object-fit: cover;
            border-radius: 10px;
        }

        /* Typography */
        h1 { font-size: 24px; color: #333; margin: 15px 0 5px; }
        p { color: #666; font-size: 14px; margin-bottom: 20px; }

        /* Button Styling */
        .buttons { display: flex; justify-content: center; gap: 15px; }
        .btn {
            padding: 10px 25px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .btn:active { transform: scale(0.95); }
        .btn-yes { background-color: #4CAF50; color: white; box-shadow: 0 4px 10px rgba(76, 175, 80, 0.3); }
        .btn-no { background-color: #f44336; color: white; box-shadow: 0 4px 10px rgba(244, 67, 54, 0.3); }
        .btn-thanku { background-color: #9c27b0; color: white; box-shadow: 0 4px 10px rgba(156, 39, 176, 0.3); }
        
        /* Hide success screen initially */
        #success-section { display: none; }

        /* Animation for Flying 'Yes' Buttons */
        .floating-yes {
            position: fixed;
            z-index: 20;
            animation: floatUp 5s ease-in forwards;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 0; }
            10% { opacity: 1; }
            100% { transform: translateY(-100vh) scale(1.5); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="card" id="main-card">
        <div id="question-section">
            <div class="gif-container">
                <img src="https://media1.tenor.com/m/GIQybzxRoNIAAAAC/very-sad-hampter-huhu.gif" alt="Sad Panda">
            </div>
            <h1>I'm Sorry! 🥺</h1>
            <p>I know I messed up... Can you please forgive me?</p>
            <div class="buttons">
                <button class="btn btn-yes" onclick="showSuccess()">Yes</button>
                <button class="btn btn-no" id="no-btn">No</button>
            </div>
        </div>

        <div id="success-section">
            <div class="gif-container">
                <img src="https://media1.tenor.com/m/1sSW-6HlFPcAAAAC/dance-dancing.gif" alt="Happy Penguin">
            </div>
            <h1>I KNEW IT! You're the best! 🎉</h1>
            <p>I promise to do better!!</p>
            <button class="btn btn-thanku" onclick="location.reload()">Thanku</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <script>
        const noBtn = document.getElementById('no-btn');
        const questionSection = document.getElementById('question-section');
        const successSection = document.getElementById('success-section');
        let noClickCount = 0;

        // What happens when "No" is clicked
        noBtn.addEventListener('click', () => {
            noClickCount++;
            
            // Make the "No" button slightly smaller with each click (like it's retreating)
            let scale = Math.max(0.3, 1 - (noClickCount * 0.1));
            noBtn.style.transform = `scale(${scale})`;

            // Spawn floating "Yes" buttons (more appear the more you click)
            spawnYesButtons(5 + (noClickCount * 3));
        });

        // Function to create flying "Yes" buttons
        function spawnYesButtons(count) {
            for (let i = 0; i < count; i++) {
                const btn = document.createElement('button');
                btn.classList.add('btn', 'btn-yes', 'floating-yes');
                btn.innerText = 'Yes';
                
                // Give them a random starting position on the screen
                const x = Math.random() * window.innerWidth;
                const y = Math.random() * window.innerHeight + 100; // Start slightly off-screen
                
                btn.style.left = `${x}px`;
                btn.style.top = `${y}px`;
                
                // If they click any of the flying buttons, it counts as a Yes!
                btn.onclick = showSuccess;

                document.body.appendChild(btn);

                // Clean them up after the animation finishes so the browser doesn't lag
                setTimeout(() => {
                    btn.remove();
                }, 3000);
            }
        }

        // What happens when "Yes" is clicked
        function showSuccess() {
            // Swap screens
            questionSection.style.display = 'none';
            successSection.style.display = 'block';
            
            // Clear away any floating buttons left on the screen
            document.querySelectorAll('.floating-yes').forEach(btn => btn.remove());

            // Fire off the confetti!
            confetti({
                particleCount: 150,
                spread: 70,
                origin: { y: 0.6 },
                colors: ['#ff0000', '#00ff00', '#0000ff', '#ffff00', '#ff00ff']
            });
        }
    </script>
</body>
</html>
